<svg width="920" height="520" viewBox="0 0 920 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sg-title sg-desc">
  <title id="sg-title">Resumen de seguridad y gobierno en Amazon S3</title>
  <desc id="sg-desc">Diagrama con un núcleo S3 y dos bloques: seguridad y gobierno, con sus controles principales.</desc>

  <defs>
    <linearGradient id="sg-bg" x1="44" y1="32" x2="884" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8F5F2"/>
    </linearGradient>
    <linearGradient id="sg-core" x1="368" y1="186" x2="552" y2="334" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8EFF4"/>
      <stop offset="1" stop-color="#DDE8EE"/>
    </linearGradient>
    <marker id="sg-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6D8FA4"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="920" height="520" rx="34" fill="#FAF7F5"/>
  <rect x="34" y="32" width="852" height="456" rx="28" fill="url(#sg-bg)" stroke="#E7D9D1"/>

  <!-- Header -->
  <text x="64" y="82" fill="#3E3A39" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Seguridad y gobierno en Amazon S3</text>
  <text x="64" y="114" fill="#6B6461" font-family="Inter, Arial, sans-serif" font-size="15">Proteger acceso y gobernar ciclo de vida evita riesgos y sobrecostos en producción.</text>

  <!-- Left card: Seguridad -->
  <rect x="64" y="156" width="264" height="280" rx="20" fill="#FAF7F5" stroke="#E0D5CE"/>
  <text x="92" y="196" fill="#6D8FA4" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">SEGURIDAD</text>
  <text x="92" y="224" fill="#3E3A39" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Control de acceso</text>

  <rect x="92" y="244" width="208" height="42" rx="11" fill="#FAF7F5" stroke="#E0D5CE"/>
  <text x="106" y="270" fill="#3E3A39" font-family="Inter, Arial, sans-serif" font-size="13">IAM + políticas de bucket</text>

  <rect x="92" y="294" width="208" height="42" rx="11" fill="#FAF7F5" stroke="#E0D5CE"/>
  <text x="106" y="320" fill="#3E3A39" font-family="Inter, Arial, sans-serif" font-size="13">Block Public Access</text>

  <rect x="92" y="344" width="208" height="42" rx="11" fill="#FAF7F5" stroke="#E0D5CE"/>
  <text x="106" y="370" fill="#3E3A39" font-family="Inter, Arial, sans-serif" font-size="13">Cifrado SSE (reposo)</text>

  <rect x="92" y="394" width="208" height="42" rx="11" fill="#FAF7F5" stroke="#E0D5CE"/>
  <text x="106" y="420" fill="#3E3A39" font-family="Inter, Arial, sans-serif" font-size="13">URL prefirmadas</text>

  <!-- Right card: Gobierno -->
  <rect x="592" y="156" width="264" height="280" rx="20" fill="#FAF7F5" stroke="#E0D5CE"/>
  <text x="620" y="196" fill="#6D8FA4" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">GOBIERNO</text>
  <text x="620" y="224" fill="#3E3A39" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Operación y control</text>

  <rect x="620" y="244" width="208" height="42" rx="11" fill="#FAF7F5" stroke="#E0D5CE"/>
  <text x="634" y="270" fill="#3E3A39" font-family="Inter, Arial, sans-serif" font-size="13">Versionado</text>

  <rect x="620" y="294" width="208" height="42" rx="11" fill="#FAF7F5" stroke="#E0D5CE"/>
  <text x="634" y="320" fill="#3E3A39" font-family="Inter, Arial, sans-serif" font-size="13">Ciclo de vida y retención</text>

  <rect x="620" y="344" width="208" height="42" rx="11" fill="#FAF7F5" stroke="#E0D5CE"/>
  <text x="634" y="370" fill="#3E3A39" font-family="Inter, Arial, sans-serif" font-size="13">Tagging y trazabilidad</text>

  <rect x="620" y="394" width="208" height="42" rx="11" fill="#FAF7F5" stroke="#E0D5CE"/>
  <text x="634" y="420" fill="#3E3A39" font-family="Inter, Arial, sans-serif" font-size="13">Auditoría (CloudTrail)</text>

  <!-- Center core -->
  <rect x="368" y="186" width="184" height="148" rx="24" fill="url(#sg-core)" stroke="#6D8FA4" stroke-width="2"/>
  <text x="460" y="228" fill="#6D8FA4" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" text-anchor="middle">NÚCLEO</text>
  <text x="460" y="266" fill="#3E3A39" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle">Amazon S3</text>
  <text x="460" y="292" fill="#6B6461" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">Objetos, buckets</text>
  <text x="460" y="310" fill="#6B6461" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">y reglas de acceso</text>

  <!-- Connectors -->
  <line x1="328" y1="260" x2="358" y2="260" stroke="#6D8FA4" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#sg-arrow)"/>
  <line x1="562" y1="260" x2="592" y2="260" stroke="#6D8FA4" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#sg-arrow)"/>

  <!-- Bottom strip -->
  <rect x="64" y="452" width="792" height="22" rx="11" fill="#F0EBE6" stroke="#E0D5CE"/>
  <text x="88" y="467" fill="#6B6461" font-family="Inter, Arial, sans-serif" font-size="12">Objetivo: acceso mínimo necesario, control de cambios, retención definida y costo optimizado.</text>
</svg>
